name: Ingesta población INE

on:
  schedule:
    # Una vez al mes, día 1 a las 06:00 UTC.
    # El padrón de INE se actualiza una vez al año, así que sobra
    # margen; correrlo mensual solo cuesta detectar el cambio antes.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}  # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write  # necesario para que el workflow pueda hacer commit

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Crear carpeta data si no existe
        run: mkdir -p data

      - name: Ejecutar ingesta INE
        run: python ingest_ine_poblacion.py

      - name: Exportar a JSON
        run: python export_poblacion.py

      - name: Comprobar si hay cambios
        id: cambios
        run: |
          if git diff --quiet -- data/poblacion.json; then
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
          else
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push si hay datos nuevos
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          git config user.name "campazas-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/poblacion.json
          git commit -m "Actualiza población INE ($(date -u +%Y-%m-%d))"
          git push
