name: Ingesta meteorología AEMET

on:
  schedule:
    # Cada 6 horas. La estación da una ventana móvil de lecturas
    # recientes, así que esta cadencia no deja huecos sin cubrir.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Crear carpeta data si no existe
        run: mkdir -p data

      - name: Ejecutar ingesta AEMET
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python ingest_aemet_meteo.py

      - name: Exportar a JSON
        run: python export_meteo.py

      - name: Comprobar si hay cambios
        id: cambios
        run: |
          if git diff --quiet -- data/meteo.json; then
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
          else
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push si hay datos nuevos
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          git config user.name "campazas-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/meteo.json
          git commit -m "Actualiza meteorología AEMET ($(date -u +%Y-%m-%dT%H:%M))"
          git push
